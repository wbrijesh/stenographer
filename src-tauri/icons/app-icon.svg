<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Squircle fill: near-white with a very subtle cool light-gray/blue tint -->
    <linearGradient id="bg" x1="512" y1="96" x2="512" y2="928" gradientUnits="userSpaceOnUse">
      <stop offset="0"    stop-color="#FFFFFF"/>
      <stop offset="0.55" stop-color="#FBFCFE"/>
      <stop offset="1"    stop-color="#EEF1F8"/>
    </linearGradient>

    <!-- Soft top highlight for premium depth -->
    <radialGradient id="topLight" cx="0.5" cy="0.16" r="0.85">
      <stop offset="0"   stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.25"/>
      <stop offset="1"   stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>

    <!-- Faint cool bottom vignette to ground the squircle -->
    <linearGradient id="vignette" x1="512" y1="560" x2="512" y2="928" gradientUnits="userSpaceOnUse">
      <stop offset="0"   stop-color="#C9D3EA" stop-opacity="0"/>
      <stop offset="1"   stop-color="#C9D3EA" stop-opacity="0.30"/>
    </linearGradient>

    <!-- The hero S: vivid blue (top) -> deep indigo/navy (bottom) -->
    <linearGradient id="sFill" x1="512" y1="268" x2="512" y2="756" gradientUnits="userSpaceOnUse">
      <stop offset="0"    stop-color="#5B7CFA"/>
      <stop offset="0.5"  stop-color="#3B49C8"/>
      <stop offset="1"    stop-color="#1B1E6E"/>
    </linearGradient>

    <!-- Soft drop shadow under the S and bars -->
    <filter id="glyphShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#2A3270" flood-opacity="0.28"/>
    </filter>

    <!-- Soft blur for the outer squircle shadow -->
    <filter id="outerShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>

    <!-- Squircle silhouette: macOS Big Sur superellipse, ~96px margin, r~228 -->
    <path id="squircle" d="M512 96
      C 736 96 818 96 866 121
      C 906 142 915 156 925 213
      C 928 263 928 351 928 512
      C 928 673 928 761 925 811
      C 915 868 906 882 866 903
      C 818 928 736 928 512 928
      C 288 928 206 928 158 903
      C 118 882 109 868 99 811
      C 96 761 96 673 96 512
      C 96 351 96 263 99 213
      C 109 156 118 142 158 121
      C 206 96 288 96 512 96 Z"/>
    <clipPath id="squircleClip"><use href="#squircle"/></clipPath>
  </defs>

  <!-- Soft outer drop shadow for the whole squircle -->
  <use href="#squircle" fill="#2A3270" opacity="0.16" transform="translate(0,12)" filter="url(#outerShadow)"/>

  <!-- Squircle body -->
  <g clip-path="url(#squircleClip)">
    <use href="#squircle" fill="url(#bg)"/>
    <use href="#squircle" fill="url(#topLight)"/>
    <use href="#squircle" fill="url(#vignette)"/>
    <!-- subtle inner top highlight along the rim -->
    <use href="#squircle" fill="none" stroke="#FFFFFF" stroke-opacity="0.7" stroke-width="3"/>
    <!-- faint cool inner edge for definition -->
    <use href="#squircle" fill="none" stroke="#AEB9D6" stroke-opacity="0.35" stroke-width="2"/>
  </g>

  <g filter="url(#glyphShadow)">
    <!-- The hero S: bold stylized capital S, optically centered in the squircle,
         filling ~60% of its width/height. Thick stroked flowing path with
         rounded terminals. -->
    <path d="M676 318
             C 624 268 546 246 462 262
             C 368 280 310 346 316 424
             C 322 504 392 544 486 568
             C 572 590 612 610 614 654
             C 616 704 558 736 484 736
             C 410 736 358 714 318 668"
          fill="none"
          stroke="url(#sFill)"
          stroke-width="104"
          stroke-linecap="round"
          stroke-linejoin="round"/>
  </g>
</svg>
