[package]
name = "stenographer"
version = "0.1.0"
description = "Stenographer — offline macOS speech-to-text"
authors = ["brijesh"]
edition = "2021"
license = "MIT"
default-run = "stenographer"

[profile.dev]
incremental = true

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name.
name = "stenographer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
once_cell = "1"
tauri = { version = "2.10.2", features = [
  "protocol-asset",
  "macos-private-api",
  "tray-icon",
  "image-png",
] }
tauri-plugin-log = "2.7.1"
tauri-plugin-opener = "2.5.2"
tauri-plugin-store = "2.4.1"
tauri-plugin-os = "2.3.2"
tauri-plugin-clipboard-manager = "2.3.2"
tauri-plugin-macos-permissions = "2.3.0"
tauri-plugin-process = "2.3.1"
tauri-plugin-fs = "2.4.4"
tauri-plugin-dialog = "2.6"
tauri-plugin-autostart = "2.5.1"
tauri-plugin-global-shortcut = "2.3.1"
tauri-plugin-single-instance = "2.3.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
specta = "=2.0.0-rc.22"
specta-typescript = "0.0.9"
tauri-specta = { version = "=2.0.0-rc.21", features = ["derive", "typescript"] }

# --- Phase 1 subsystem dependencies (mirrors Handy's proven set) ---
anyhow = "1.0.95"
tokio = { version = "1.43.0", features = ["full"] }
chrono = "0.4"
regex = "1"
# audio capture + VAD
cpal = "0.16.0"
rubato = "0.16.2"
hound = "3.5.1"
rustfft = "6.4.0"
vad-rs = { git = "https://github.com/cjpais/vad-rs", default-features = false }
rodio = { git = "https://github.com/cjpais/rodio.git" }
# transcription + model download
reqwest = { version = "0.12", features = ["json", "stream"] }
futures-util = "0.3"
tar = "0.4.44"
flate2 = "1.0"
sha2 = "0.10"
# text injection
enigo = "0.6.1"
# trigger / hotkeys
handy-keys = "0.2.4"
rdev = { git = "https://github.com/rustdesk-org/rdev" }

[target.'cfg(target_os = "macos")'.dependencies]
tauri-nspanel = { git = "https://github.com/ahkohd/tauri-nspanel", branch = "v2.1" }
transcribe-rs = { version = "0.3.8", features = ["whisper-cpp", "onnx", "whisper-metal"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "unwind"

# Disable stripping for host proc-macro dylibs and build scripts. On this macOS
# toolchain, stripping proc-macro dylibs corrupts them ("mis-aligned LINKEDIT
# string pool"), causing dependent crates to fail to load them at compile time.
# The final app binary is still stripped via [profile.release] above.
[profile.release.build-override]
strip = false
